[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-mcp"
version = "0.1.0"
description = "Academic research engine as a standalone MCP server: a per-project SQLite library of papers analysed in two rounds, gap analysis, drafts and an arXiv/Semantic Scholar scout — with Claude Code as the reasoning model. No remote LLM, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vicente Rivas Monferrer" }]
keywords = ["mcp", "claude-code", "research", "academic", "papers", "arxiv", "literature-review", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pypdf>=4.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/vjrivmon/strata-mcp"
Repository = "https://github.com/vjrivmon/strata-mcp"
Issues = "https://github.com/vjrivmon/strata-mcp/issues"

[project.scripts]
strata-mcp = "strata_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["strata_mcp"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["strata_mcp"]
